name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy 2.5.3 and scipy 1.18.1 (requirements.txt) need Python 3.12 or later
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests -q

      - name: Rebuild manifest from committed raw results
        run: |
          python -m tools.build_manifest

      - name: Check manifest matches the committed copy (reference Python 3.13)
        if: matrix.python-version == '3.13'
        run: |
          git diff --exit-code results/manifest.json

      - name: Smoke-test figure generation
        run: |
          python -m src.figures.make_all

      - name: Upload figures as artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: figures
          path: results/figures/*.png
          retention-days: 14
